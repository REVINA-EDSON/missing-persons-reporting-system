<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Missing Persons System</title>
  <!-- CSS Links -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="light-mode">
  <!-- Main Content -->
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="forgot-password-container">
      <div class="text-center mb-4">
        <i class="fa-solid fa-key fa-3x text-primary"></i>
        <h2 class="mt-2 fw-bold">Reset Password</h2>
        <p class="text-muted">Enter your email address to reset your password.</p>
      </div>

      <form id="forgotPasswordForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="Enter email" required />
            <div class="invalid-feedback">Please enter your email address.</div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
      </form>

      <div class="text-center mt-3">
        <a href="admin-login.html" class="text-muted small">Back to Login</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Form Validation and Submission
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    forgotPasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;

      // Bootstrap form validation
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const email = document.getElementById('email').value;

      try {
        const response = await fetch('send-reset-link.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();
        alert(data.message);
      } catch (error) {
        console.error('Error sending reset link:', error);
        alert('An error occurred while sending reset link. Please try again.');
      }
    });
  </script>
</body>
</html>
