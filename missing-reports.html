<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missing Persons Reports | Admin Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />





  <style>
    :root {
      --primary-color: #6C5CE7;
      --secondary-color: #00CEC9;
      --dark-color: #2d2b4a;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      padding-top: 70px;
    }
    
    /* Sidebar styles */
    .sidebar {
      width: 280px;
      background: white;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    }
    
    /* Table styles */
    .table-responsive {
      overflow-x: auto;
    }
    
    .report-image {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }
    
    .action-buttons .btn {
      margin: 2px;
      min-width: 80px;
    }
    
    .badge-pending {
      background-color: #ffc107;
      color: #212529;
    }
    
    .badge-approved {
      background-color: #28a745;
    }
    
    .badge-rejected {
      background-color: #dc3545;
    }
    
    /* Modal styles */
    .modal-body img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    
    /* Loading indicator */
    #loadingIndicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1050;
    }
    
    /* Dark mode styles */
    .dark-mode {
      background-color: #1a1a2e;
      color: #f8f9fa;
    }
    
    .dark-mode .card,
    .dark-mode .modal-content {
      background-color: #2d2b4a;
      color: #f8f9fa;
    }
    
    .dark-mode .table {
      color: #f8f9fa;
    }
  </style>



</head>
<body class="light-mode">
  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="fas fa-search-location me-2"></i>Case Management Panel
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <button id="themeToggle" class="btn btn-outline-light">
              <i class="fas fa-moon"></i> Dark Mode
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Sidebar -->
  <div class="sidebar position-fixed h-100">
    <div class="sidebar-header p-3 border-bottom">
      <h5 class="mb-0">
        <i class="fas fa-user-shield me-2"></i>missing Persons
      </h5>
    </div>
    <div class="sidebar-menu p-3">
      <ul class="nav flex-column">
        <li class="nav-item mb-2">
          <a class="nav-link" href="admin-dashboard.html">
            <i class="fas fa-tachometer-alt me-2"></i>Dashboard
          </a>

          
          <li class="nav-item mb-2">
            <a class="nav-link" href="found-reports.html">
              <i class="fas fa-check-circle me-2"></i>Found Reports
            </a>
          </li>
        
        
        <a href="admin-login.html" class="btn btn-danger btn-sm w-100 mt-3">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </ul>
    </div>
  </div>


  <!-- Main Content -->
  <main class="main-content ms-auto" style="width: calc(100% - 280px); padding: 20px;">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">
          <i class="fas fa-search me-2"></i>Missing Persons Reports
        </h2>
        
      </div>
      
      <!-- Filters Card -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label for="searchName" class="form-label">Search by Name</label>
              <input type="text" class="form-control" id="searchName" placeholder="Enter missing person's name...">
            </div>
            <div class="col-md-3">
              <label for="filterStatus" class="form-label">Status</label>
              <select class="form-select" id="filterStatus">
                <option value="all">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="filterDate" class="form-label">Date Reported</label>
              <input type="date" class="form-control" id="filterDate">
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button class="btn btn-primary w-100" id="applyFiltersBtn">
                <i class="fas fa-filter me-2"></i>Filter
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Reports Table -->
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0"><i class="fas fa-list me-2"></i> Missing Persons Reports</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-primary">
                <tr>
                  <th>Photo</th>
                  <th>Name</th>
                  <th>Age</th>
                  <th>Gender</th>
                  <th>Last Seen</th>
                  <th>Date Reported</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="missingReportsBody">
                <!-- Reports will be loaded here -->
              </tbody>
            </table>
          </div>
          
          <!-- Pagination -->
          <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination">
              <li class="page-item disabled">
                <a class="page-link" href="#" tabindex="-1">Previous</a>
              </li>
              <li class="page-item active"><a class="page-link" href="#">1</a></li>
              <li class="page-item"><a class="page-link" href="#">2</a></li>
              <li class="page-item"><a class="page-link" href="#">3</a></li>
              <li class="page-item">
                <a class="page-link" href="#">Next</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </main>

  <!-- Report Details Modal -->
  <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <!-- Content will be loaded dynamically -->
      </div>
    </div>
  </div>

  <!-- Loading Indicator -->
  <div id="loadingIndicator" class="spinner-border text-primary" style="width: 3rem; height: 3rem; display: none;" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>

  <!-- Bootstrap & jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script>
    // Initialize page
    $(document).ready(function() {
      // Load initial reports
      loadMissingReports();
      
      // Set up filter button
      $('#applyFiltersBtn').click(function() {
        const filters = {
          name: $('#searchName').val(),
          status: $('#filterStatus').val(),
          date: $('#filterDate').val()
        };
        loadMissingReports(filters);
      });
      
      // Set up add new report button
      $('#addMissingReportBtn').click(function() {
        window.location.href = 'add-missing-report.html';
      });
      
      // Theme toggle
      $('#themeToggle').click(function() {
        $('body').toggleClass('dark-mode');
        const isDark = $('body').hasClass('dark-mode');
        $(this).html(`<i class="fas fa-${isDark ? 'sun' : 'moon'}"></i> ${isDark ? 'Light' : 'Dark'} Mode`);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
      
      // Check for saved theme preference
      if (localStorage.getItem('theme') === 'dark') {
        $('body').addClass('dark-mode');
        $('#themeToggle').html('<i class="fas fa-sun"></i> Light Mode');
      }
    });

    // Load missing reports from database
    function loadMissingReports(filters = {}) {
      $('#loadingIndicator').show();
      $('#missingReportsBody').html('<tr><td colspan="8" class="text-center py-4">Loading reports...</td></tr>');
      
      $.ajax({
        url: 'get_missing_reports.php',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(filters),
        success: function(data) {
          if (data.success) {
            renderReports(data.reports);
          } else {
            showError(data.error || 'Failed to load reports');
          }
        },
        error: function(xhr, status, error) {
          showError('Error loading reports: ' + error);
        },
        complete: function() {
          $('#loadingIndicator').hide();
        }
      });
    }

    // Render reports in the table
    function renderReports(reports) {
      const $tableBody = $('#missingReportsBody');
      $tableBody.empty();
      
      if (!reports || reports.length === 0) {
        $tableBody.html(`
          <tr>
            <td colspan="8" class="text-center py-4 text-muted">
              <i class="fas fa-exclamation-circle me-2"></i>
              No missing persons reports found
            </td>
          </tr>
        `);
        return;
      }
      
      reports.forEach(report => {
        const fullName = `${report.missing_first_name} ${report.missing_middle_name ? report.missing_middle_name + ' ' : ''}${report.missing_last_name}`;
        const $row = $(`
          <tr>
            <td>
              <img src="${report.picture || 'images/default-profile.jpg'}" 
                   alt="${fullName}" 
                   class="report-image"
                   onerror="this.src='images/default-profile.jpg'">
            </td>
            <td>${fullName}</td>
            <td>${report.missing_age || 'Unknown'}</td>
            <td>${report.missing_gender || 'Unknown'}</td>
            <td>${report.last_seen_location || 'Unknown'}</td>
            <td>${formatDate(report.report_date)}</td>
            <td>
              <span class="badge ${getStatusBadgeClass(report.status)}">
                ${report.status || 'Pending'}
              </span>
            </td>
            <td class="text-end action-buttons">
              <button class="btn btn-sm btn-primary view-btn" data-id="${report.report_id}">
                <i class="fas fa-eye me-1"></i>View
              </button>
              <button class="btn btn-sm btn-success approve-btn" data-id="${report.report_id}">
                <i class="fas fa-check me-1"></i>Approve
              </button>
              <button class="btn btn-sm btn-danger reject-btn" data-id="${report.report_id}">
                <i class="fas fa-times me-1"></i>Reject
              </button>
            </td>
          </tr>
        `);
        
        $tableBody.append($row);
      });
      
      // Add event listeners to buttons
      addReportActionListeners();
    }

    // Add event listeners to action buttons
    function addReportActionListeners() {
      $('.view-btn').click(function() {
        const reportId = $(this).data('id');
        viewReportDetails(reportId);
      });
      
      $('.approve-btn').click(function() {
        const reportId = $(this).data('id');
        updateReportStatus(reportId, 'approved');
      });
      
      $('.reject-btn').click(function() {
        const reportId = $(this).data('id');
        updateReportStatus(reportId, 'rejected');
      });
    }

    // View detailed report
    function viewReportDetails(reportId) {
      $('#loadingIndicator').show();
      
      $.ajax({
        url: 'get_report_details.php',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ report_id: reportId }),
        success: function(data) {
          if (data.success) {
            showReportModal(data.report);
          } else {
            showError(data.error || 'Failed to load report details');
          }
        },
        error: function(xhr, status, error) {
          showError('Error loading report details: ' + error);
        },
        complete: function() {
          $('#loadingIndicator').hide();
        }
      });
    }

    // Show report details in modal
    function showReportModal(report) {
      const formattedDate = formatDate(report.lost_day);
      const formattedTime = report.lost_time ? formatTime(report.lost_time) : 'Unknown';
      
      const modalContent = `
        <div class="modal-header">
          <h5 class="modal-title">Report #${report.report_id}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-4 text-center">
              <img src="${report.picture || 'images/default-profile.jpg'}" 
                   class="img-fluid rounded mb-3"
                   onerror="this.src='images/default-profile.jpg'">
              <h4>${report.missing_first_name} ${report.missing_last_name}</h4>
              <p><strong>Age:</strong> ${report.missing_age || 'Unknown'}</p>
              <p><strong>Gender:</strong> ${report.missing_gender || 'Unknown'}</p>
            </div>
            <div class="col-md-8">
              <div class="mb-4">
                <h5>Last Seen Details</h5>
                <p><strong>Location:</strong> ${report.last_seen_location || 'Unknown'}</p>
                <p><strong>Date:</strong> ${formattedDate} at ${formattedTime}</p>
              </div>
              
              <div class="mb-4">
                <h5>Physical Description</h5>
                <p>${report.physical_appearance || 'No description provided'}</p>
              </div>
              
              <div class="mb-4">
                <h5>Reporter Information</h5>
                <p><strong>Name:</strong> ${report.reporter_first_name} ${report.reporter_last_name}</p>
                <p><strong>Phone:</strong> ${report.phone_number || 'Not provided'}</p>
                <p><strong>Relationship:</strong> ${report.relationship || 'Not specified'}</p>
              </div>
              
              ${report.additional_description ? `
              <div class="mb-4">
                <h5>Additional Information</h5>
                <p>${report.additional_description}</p>
              </div>
              ` : ''}
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      `;
      
      $('#reportModal .modal-content').html(modalContent);
      new bootstrap.Modal(document.getElementById('reportModal')).show();
    }

    // Update report status
    function updateReportStatus(reportId, status) {
      if (!confirm(`Are you sure you want to ${status} this report?`)) return;
      
      $('#loadingIndicator').show();
      
      $.ajax({
        url: 'update_report_status.php',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ 
          report_id: reportId, 
          status: status 
        }),
        success: function(data) {
          if (data.success) {
            showSuccess(`Report ${status} successfully`);
            loadMissingReports(); // Refresh the table
          } else {
            showError(data.error || `Failed to ${status} report`);
          }
        },
        error: function(xhr, status, error) {
          showError(`Error updating status: ${error}`);
        },
        complete: function() {
          $('#loadingIndicator').hide();
        }
      });
    }

    // Helper functions
    function getStatusBadgeClass(status) {
      switch((status || '').toLowerCase()) {
        case 'approved': return 'bg-success';
        case 'rejected': return 'bg-danger';
        case 'pending': return 'bg-warning';
        default: return 'bg-secondary';
      }
    }

    function formatDate(dateString) {
      if (!dateString) return 'Unknown';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric' 
      });
    }

    function formatTime(timeString) {
      if (!timeString) return 'Unknown';
      const [hours, minutes] = timeString.split(':');
      const date = new Date();
      date.setHours(hours, minutes);
      return date.toLocaleTimeString('en-US', { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
    }

    function showSuccess(message) {
      const $alert = $(`
        <div class="alert alert-success alert-dismissible fade show position-fixed top-0 end-0 m-3" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `);
      $('body').append($alert);
      setTimeout(() => $alert.alert('close'), 3000);
    }

    function showError(message) {
      const $alert = $(`
        <div class="alert alert-danger alert-dismissible fade show position-fixed top-0 end-0 m-3" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `);
      $('body').append($alert);
      setTimeout(() => $alert.alert('close'), 5000);
    }
  </script>
</body>
</html>
