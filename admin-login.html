<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Missing Persons System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles/admin-login.css" />

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body class="light-mode">
  
  <div id="particles-js"></div>

  <!-- Page Preloader -->
  <div class="page-loader">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-container fade-in">
      <div class="text-center mb-4">
        <i class="fa-solid fa-magnifying-glass-location fa-3x text-primary"></i>
        <h2 class="mt-2 fw-bold">Admin Login</h2>
        <p class="text-muted">Missing Persons Reporting System</p>
      </div>

      <!-- Theme Toggle -->
      <div class="theme-toggle">
        <input type="checkbox" id="themeToggle" />
        <label for="themeToggle" class="theme-toggle-label"></label>
        <span class="text-muted small"><i class="fa-solid fa-moon me-1"></i> Dark Mode</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Enter username" required />
            <div class="invalid-feedback">Please enter your username.</div>
          </div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required />
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <!-- Links -->
      <div class="text-center mt-3">
        <a href="forgot-password.html" class="text-muted small">Forgot Password?</a>
        <span class="text-muted small mx-2">|</span>
        <a href="index.html" class="text-muted small">Back to Home</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Particle.js Background
    document.addEventListener('DOMContentLoaded', () => {
      particlesJS('particles-js', {
        particles: {
          number: { value: 60, density: { enable: true, value_area: 800 } },
          color: { value: "#6C5CE7" },
          opacity: { value: 0.3, random: true },
          size: { value: 3, random: true },
          line_linked: { enable: true, distance: 150, color: "#6C5CE7", opacity: 0.2, width: 1 },
          move: { enable: true, speed: 2, direction: "none", random: true }
        },
        interactivity: { detect_on: "canvas", events: { onhover: { enable: false } } }
      });
    });

    // Preloader
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.querySelector('.page-loader').classList.add('fade-out');
      }, 500);
    });

    // Dark Mode Toggle
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('change', () => {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    });

    // Load Theme Preference
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      themeToggle.checked = true;
    }

    // Form Validation and Submission
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;

      // Bootstrap form validation
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('admin-login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (data.status === 'success') {
          alert(data.message);
          // Redirect after successful login
          window.location.href = 'admin-dashboard.html'; // Create this page accordingly
        } else {
          alert(data.message);
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('An error occurred during login. Please try again.');
      }
    });
  </script>
</body>
</html>
